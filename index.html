
<!DOCTYPE html>
<html>
<head>
<title>Ayurvedic Traceability</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

<div class="sidebar">
  <h2>🌿 Ayurveda</h2>
  <button onclick="showAuth()">Login / Signup</button>
  <button onclick="showFarmer()">Farmer Dashboard</button>
  <button onclick="showConsumer()">Consumer Dashboard</button>
</div>

<div class="main">

<div id="auth" class="card">
  <h3>Login / Signup</h3>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <select id="role">
    <option value="farmer">Farmer</option>
    <option value="consumer">Consumer</option>
  </select>
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
  <p id="authMsg"></p>
</div>

<div id="farmer" class="card hidden">
  <h3>Farmer Dashboard</h3>
  <input id="batchId" placeholder="Batch ID">
  <input id="herbName" placeholder="Herb Name">
  <input id="location" placeholder="Location">
  <button onclick="addHerb()">Add Herb & Generate QR</button>
  <div id="qr"></div>
</div>

<div id="consumer" class="card hidden">
  <h3>Consumer Verification</h3>
  <input id="verifyId" placeholder="Batch ID">
  <button onclick="verify()">Verify</button>
  <pre id="result"></pre>
</div>

</div>

<script>
function showAuth(){hideAll();auth.classList.remove("hidden");}
function showFarmer(){hideAll();farmer.classList.remove("hidden");}
function showConsumer(){hideAll();consumer.classList.remove("hidden");}
function hideAll(){auth.classList.add("hidden");farmer.classList.add("hidden");consumer.classList.add("hidden");}

async function signup(){
 const r=await fetch("http://localhost:5000/signup",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username:username.value,password:password.value,role:role.value})});
 authMsg.innerText=(await r.json()).message;
}

async function login(){
 const r=await fetch("http://localhost:5000/login",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username:username.value,password:password.value})});
 const d=await r.json();
 if(!r.ok){authMsg.innerText=d.message;return;}
 hideAll();
 if(d.role==="farmer") farmer.classList.remove("hidden");
 else consumer.classList.remove("hidden");
}

async function addHerb(){
 await fetch("http://localhost:5000/addHerb",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({batchId:batchId.value,herbName:herbName.value,location:location.value})});
 qr.innerHTML="";
 new QRCode(qr,"http://localhost:5000/verify/"+batchId.value);
}

async function verify(){
 const r=await fetch("http://localhost:5000/verify/"+verifyId.value);
 result.innerText=JSON.stringify(await r.json(),null,2);
}
</script>

</body>
</html>
